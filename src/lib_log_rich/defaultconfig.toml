# Example default layer for host applications that configure lib_log_rich
#
# lib_log_rich itself does not read this file or defaultconfig.d/*.toml. They ship as an example for a
# host application that loads its configuration in layers (for example with lib_layered_config):
# copy the [lib_log_rich] table from defaultconfig.d/90-logging.toml into the application's own
# default layer and pass the loaded table to the runtime:
#
#     lib_log_rich.init(lib_log_rich.RuntimeConfig(**config["lib_log_rich"]))
#
# A layered loader then lets later layers (host and user config files, a .env file, environment
# variables) override the defaults; the paths and the <SLUG> prefix are the host application's own.
# After that, lib_log_rich's own LOG_* environment variables (LOG_CONSOLE_LEVEL, LOG_RATE_LIMIT, ...)
# override most RuntimeConfig fields at init().
#
# IMPORTANT: Naming Conventions for .env Files vs Environment Variables (lib_layered_config)
# ------------------------------------------------------------------------------------------
#
# .env FILES (no prefix needed):
#   Format: SECTION__KEY=value
#   Uses double underscore (__) to create nested structures.
#
#   Examples in .env file:
#     MY_SECTION__SOME_KEY=some_value
#     MY_SECTION__TIMEOUT=60.0
#     LIB_LOG_RICH__CONSOLE_LEVEL=DEBUG
#
# ENVIRONMENT VARIABLES (require prefix):
#   Format: PREFIX___SECTION__KEY=value
#   Uses triple underscore (___) to separate PREFIX from SECTION,
#   and double underscore (__) to separate SECTION from KEY.
#
#   Examples as environment variables:
#     <SLUG>___MY_SECTION__SOME_KEY=some_value
#     <SLUG>___LIB_LOG_RICH__CONSOLE_LEVEL=DEBUG
#
# Value coercion: "true"/"false" -> bool, "null"/"none" -> None, numbers -> int/float
